            - text: I
            - heading "The ring" [level=3] [ref=f2e39]
            - paragraph [ref=f2e40]: Every full moon a brass ring lights up at the edge of the sky. The night watchman called it the gate and kept his lantern well away. Nobody had ever seen anything come through it.
          - listitem [ref=f2e41]:
            - text: II
            - heading "The landing" [level=3] [ref=f2e42]
            - paragraph [ref=f2e43]: One warm night, something did. First two round ears, then a sleepy orange head, then a very serious little face. Ditó stepped onto the nearest cloud, patted it twice and sat down. It was soft, he said, and he was staying.
          - listitem [ref=f2e44]:
            - button "Boop Ditó (that’s me!)" [ref=f2e45] [cursor=pointer]: that’s me!
            - text: III
            - heading "The stitch" [level=3] [ref=f2e73]
            - paragraph [ref=f2e74]: He arrived with a seam down his tummy, a mended patch on one ear and a tiny brass ring on a string, a piece of the gate he would not give back. The night watchman asked his name. He said “Ditó”, and it sounded like a small bell going up.
        - paragraph [ref=f2e75]: He is still up there. The cloud is polite about it.
